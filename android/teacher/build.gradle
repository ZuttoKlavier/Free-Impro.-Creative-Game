plugins { id 'com.android.application' }
def classroomDir = rootProject.file('../data/https')
def publicClassroomUrl = providers.gradleProperty('classroomUrl').getOrNull()
if (publicClassroomUrl != null && publicClassroomUrl != 'https://class.empfreeimpro.xyz/') {
    throw new GradleException('Public classroom packages support only https://class.empfreeimpro.xyz/; other domains, ports, credentials, queries and paths are not supported.')
}
if (publicClassroomUrl != null && providers.gradleProperty('classroomPort').isPresent()) {
    throw new GradleException('Do not combine classroomUrl with classroomPort; the public classroom uses HTTPS port 443.')
}
def config = publicClassroomUrl == null ? new groovy.json.JsonSlurper().parse(new File(classroomDir, 'config.json')) : null
def classroomUrl = publicClassroomUrl == null ? 'https://' + config.preferredHost + ':' + providers.gradleProperty('classroomPort').getOrElse('8443') + '/' : publicClassroomUrl
def resources = layout.buildDirectory.dir('generated/classroom-res')
tasks.register('prepareClassroomCertificate', Copy) {
    from new File(classroomDir, 'classroom-ca.crt')
    into resources.map { it.dir('raw') }
    rename { 'classroom_ca.crt' }
    doFirst { if (!new File(classroomDir, 'classroom-ca.crt').exists()) throw new GradleException('Run npm run setup:https before building the teacher app.') }
}
android {
    namespace 'org.freeimpro.teacher'
    compileSdk 35
    defaultConfig {
        applicationId 'org.freeimpro.teacher'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        buildConfigField 'String', 'CLASSROOM_URL', '"' + classroomUrl + '"'
    }
    buildFeatures { buildConfig true }
    sourceSets.main.res.srcDirs resources, '../app/src/main/res'
    buildTypes { debug { debuggable false }; release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
tasks.named('preBuild').configure { dependsOn 'prepareClassroomCertificate' }
dependencies { testImplementation 'junit:junit:4.13.2' }
